[project]
name = "agent-hify"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "celery>=5.4",
    "redis>=5.2",
    "bcrypt>=4.2",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hify"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：Depends/Header/Query 等作为参数默认值是框架推荐写法，
# 不应被 B008（函数调用作默认值）拦截。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["agent_hify"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要真实数据库/外部依赖的集成测试",
]

[tool.importlinter]
root_package = "agent_hify"

[[tool.importlinter.contracts]]
name = "core is foundation (no internal deps except stdlib/third-party)"
type = "forbidden"
source_modules = ["agent_hify.core"]
forbidden_modules = [
    "agent_hify.modules",
    "agent_hify.observability",
    "agent_hify.worker",
]

[[tool.importlinter.contracts]]
name = "identity depends only on core/observability"
type = "forbidden"
source_modules = ["agent_hify.modules.identity"]
forbidden_modules = [
    "agent_hify.modules",
    "agent_hify.worker",
]
