[project]
name = "agent-hify"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "celery>=5.4",
    "redis>=5.2",
    "bcrypt>=4.2",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "litellm>=1.55",
    "llama-index-core>=0.12",
    "mcp>=1.0",
    "pypdf>=5.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hify"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：Depends/Header/Query 等作为参数默认值是框架推荐写法，
# 不应被 B008（函数调用作默认值）拦截。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["agent_hify"]

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要真实数据库/外部依赖的集成测试",
]

[tool.importlinter]
root_package = "agent_hify"

[[tool.importlinter.contracts]]
name = "core is foundation (no internal deps)"
type = "forbidden"
source_modules = ["agent_hify.core"]
forbidden_modules = [
    "agent_hify.modules",
    "agent_hify.worker",
]

[[tool.importlinter.contracts]]
name = "observability service depends only on core"
type = "forbidden"
source_modules = ["agent_hify.modules.observability"]
forbidden_modules = [
    "agent_hify.modules.identity",
    "agent_hify.modules.models",
    "agent_hify.worker",
]
ignore_imports = [
    "agent_hify.modules.observability.router -> agent_hify.modules.identity.deps",
    "agent_hify.modules.observability.router -> agent_hify.modules.identity.schemas",
]

[[tool.importlinter.contracts]]
name = "identity depends only on core"
type = "forbidden"
source_modules = ["agent_hify.modules.identity"]
forbidden_modules = [
    "agent_hify.modules.models",
    "agent_hify.modules.observability",
    "agent_hify.worker",
]

# models(L2) 只能向下依赖 core/identity/observability；禁止依赖更上层能力/编排模块。
# 这些上层模块尚未落地，列入是为未来防回归(import-linter 容忍 forbidden 指向不存在模块)。
[[tool.importlinter.contracts]]
name = "models does not depend on upper layers"
type = "forbidden"
source_modules = ["agent_hify.modules.models"]
forbidden_modules = [
    "agent_hify.modules.knowledge",
    "agent_hify.modules.tools",
    "agent_hify.modules.apps",
    "agent_hify.modules.runtime",
    "agent_hify.worker",
]

[[tool.importlinter.contracts]]
name = "apps does not depend on upper layers"
type = "forbidden"
source_modules = ["agent_hify.modules.apps"]
forbidden_modules = [
    "agent_hify.modules.models",
    "agent_hify.modules.runtime",
    "agent_hify.modules.knowledge",
    "agent_hify.modules.tools",
    "agent_hify.worker",
]

# runtime(L4) 编排层：可向下依赖 apps/models/observability/knowledge，
# 但禁止依赖 tools 与 worker（分层约束）。
[[tool.importlinter.contracts]]
name = "runtime does not depend on tools/worker"
type = "forbidden"
source_modules = ["agent_hify.modules.runtime"]
forbidden_modules = [
    "agent_hify.modules.tools",
    "agent_hify.worker",
]

# knowledge(L2') 禁止依赖 runtime/tools/apps（只能依赖 core/identity/observability/models）
# router 作为入口层允许调用 worker.tasks 派发摄取任务（架构许可，仅限 router→worker.tasks）
[[tool.importlinter.contracts]]
name = "knowledge does not depend on upper layers"
type = "forbidden"
source_modules = ["agent_hify.modules.knowledge"]
forbidden_modules = [
    "agent_hify.modules.runtime",
    "agent_hify.modules.tools",
    "agent_hify.modules.apps",
    "agent_hify.worker",
]
ignore_imports = [
    "agent_hify.modules.knowledge.router -> agent_hify.worker.tasks",
]

# tools(L2) 禁止依赖 knowledge/apps/runtime/worker（只能依赖 core/identity/observability/models）
[[tool.importlinter.contracts]]
name = "tools does not depend on upper layers"
type = "forbidden"
source_modules = ["agent_hify.modules.tools"]
forbidden_modules = [
    "agent_hify.modules.knowledge",
    "agent_hify.modules.apps",
    "agent_hify.modules.runtime",
    "agent_hify.worker",
]
